<script>
/* =========================
   候補者
========================= */

function getImageInfo(n){

  // 2815〜2820
  if(n>=2815 && n<=2820){
    return {
      prefix:'IMAGE_',
      ext:'.jpg'
    };
  }

  // 2821〜2825（2824を除く）
  if(
    n>=2821 &&
    n<=2825 &&
    n!==2824
  ){
    return {
      prefix:'IMG_',
      ext:'.WEBP'
    };
  }

  // 2877〜2881
  if(n>=2877 && n<=2881){
    return {
      prefix:'IMG_',
      ext:'.WEBP'
    };
  }

  // 2832〜2837
  if(n>=2832 && n<=2837){
    return {
      prefix:'IMG_',
      ext:'.jpg'
    };
  }

  // 2900〜2903
  if(n>=2900 && n<=2903){
    return {
      prefix:'IMG_',
      ext:'.jpg'
    };
  }

  // その他
  return {
    prefix:'IMG_',
    ext:'.JPG'
  };
}


const imageNumbers=[];

for(let n=2815;n<=2903;n++){

  if(n>=2828 && n<=2831){
    continue;
  }

  imageNumbers.push(n);
}


const names=[
  'EXILE AKIRA',

  'EXILE TETSUYA',
  'EXILE NESMITH',

  'LIKIYA',
  '陣',

  '神谷健太',
  '与那嶺瑠唯',
  '山本彰吾',
  '川村壱馬',
  '吉野北人',
  '岩谷翔吾',
  '浦川翔平',
  '藤原樹',
  '武知海青',
  '長谷川慎',
  '龍',
  '鈴木昂秀',
  '後藤拓磨',
  '世界',
  '佐藤大樹',
  '澤本夏輝',
  '瀬口黎弥',
  '堀夏喜',
  '木村慧人',
  '八木勇征',
  '中島颯太',
  '中尾翔太',
  '日高竜太',
  '加納嘉将',
  '海沼流星',
  '深堀未来',
  '奥田力也',
  '松井利樹',
  '砂田将宏',
  '剣',
  '中西椋雅',
  '渡邉廉',
  'JIMMY',
  '小波津志',
  '半田龍臣',
  'WEESA',
  '岩城星那',
  '中村竜大',
  '山田晃大',
  '岡尾真虎',
  '百田隼麻',
  '難波碧空',
  '夫松健介',
  '遠藤翼空',
  '岡尾琥珀',
  '川口蒼真',
  '佐藤峻乃介',
  '山本光汰',
  '鈴木瑠偉',
  'YUHI',
  'AERON',
  'KOTA',
  'SHOW',
  'TAKUMI',
  'HINATA',
  'TAKI',
  'NOSUKE',
  'SHIGETORA',
  'AOI',
  'RYOJI',
  'SUZUKI',
  'GHEE',
  'HIROTO'
];

const items=Array.from(
  {length:85},
  (_,i)=>{

    const n=imageNumbers[i];
    const info=getImageInfo(n);

    return {
      id:i+1,
      name:names[i],
      image:
        `images/${info.prefix}${n}${info.ext}`
    };

  }
);
/* =========================
   DOM
========================= */
const app=document.getElementById('app');
const bar=document.getElementById('progressBar');
/* =========================
   STEP1
========================= */
let s1Groups=[];
let s1i=0;
let s1Selected=new Set();
/*
  各4人グループで
  どの人を選んだか保存する
*/
let s1Choices=[];
let scores=new Map();
/* =========================
   STEP2
========================= */
let s2Groups=[];
let s2i=0;
let s2First=null;
let s2Results=[];

let s2Round=0;
let s2Scores=new Map();
/* =========================
   STEP3
========================= */
let finalCandidates=[];
let finalMatches=[];
let finalI=0;
let finalWins=new Map();
/* =========================
   シャッフル
========================= */
function shuffle(a){
  a=[...a];
  for(
    let i=a.length-1;
    i>0;
    i--
  ){
    let j=
      Math.floor(
        Math.random()*(i+1)
      );
    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];
  }
  return a;
}
/* =========================
   画像エラー
========================= */
function imgError(img){

  const extensions=[
    '.JPG',
    '.jpeg',
    '.JPEG',
    '.webp',
    '.WEBP'
  ];

  let current=
    img.src.split('/').pop();

  let base=
    current.substring(
      0,
      current.lastIndexOf('.')
    );

  let tried=
    img.dataset.tried
      ? Number(img.dataset.tried)
      : 0;

  if(tried<extensions.length){

    img.dataset.tried=
      tried+1;

    img.src=
      'images/'+
      base+
      extensions[tried];

    return;
  }

  img.onerror=null;

  img.src=
    'data:image/svg+xml;charset=UTF-8,'+
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" '+
      'viewBox="0 0 400 400">'+
      '<rect width="400" height="400" fill="#eee"/>'+
      '<text x="200" y="200" '+
      'text-anchor="middle" '+
      'dominant-baseline="middle" '+
      'font-size="24" fill="#888">'+
      '画像なし</text>'+
      '</svg>'
    );
}
/* =========================
   カード
========================= */
function card(x,selected=false){
  return `
    <div
      class="card ${selected?'selected':''}"
      data-id="${x.id}"
    >
      <img
        src="${x.image}"
        onerror="imgError(this)"
      >
      <div class="name">
        ${x.name}
      </div>
    </div>
  `;
}
/* =========================
   プログレスバー
========================= */
function progress(n,total){
  bar.style.width=
    Math.min(
      100,
      n/total*100
    )+'%';
}
/* ==================================================
   STEP1開始
   85人を4人ずつに分ける
================================================== */
function start(){
  const a=shuffle(items);
  s1Groups=[];
  for(
    let i=0;
    i<a.length;
    i+=4
  ){
    s1Groups.push(
      a.slice(i,i+4)
    );
  }
/*
  85人なので
  4人 × 21グループ
  ＋最後1人
  =22グループ
*/
  s1i=0;
  /*
    各グループの選択内容を保存
  */
  s1Choices=
    s1Groups.map(
      ()=>new Set()
    );
  s1Selected=
    new Set();
  scores=
    new Map(
      items.map(
        x=>[x.id,0]
      )
    );
  renderS1();
}
/* ==================================================
   STEP1画面
================================================== */
function renderS1(){
  /*
    前のグループから戻ってきた場合、
    そのときの選択を復元
  */
  s1Selected=
    new Set(
      s1Choices[s1i]
    );
  const g=
    s1Groups[s1i];
  progress(
    s1i,
    s1Groups.length
  );
  app.innerHTML=`
    <div class="stage">
      STEP 1 / 3
    </div>
    <p class="instruction">
      4人の中から、
      好きな人を
      <b>0〜4人</b>
      選んでください
    </p>
    <div class="grid">
      ${
        g.map(
          x=>
            card(
              x,
              s1Selected.has(x.id)
            )
        ).join('')
      }
    </div>
    <div class="actions">
      ${
        s1i>0
        ?
        `
          <button
            id="back"
            class="back-button"
          >
            ← 前の4人に戻る
          </button>
        `
        :
        ''
      }
      <button id="next">
        次へ
      </button>
    </div>
    <div class="notice">
      0人を選ぶ場合は、
      そのまま「次へ」
    </div>
  `;
  /* =========================
     カード選択
  ========================= */
  document
    .querySelectorAll('.card')
    .forEach(el=>{
      el.onclick=()=>{
        const id=
          +el.dataset.id;
        if(
          s1Selected.has(id)
        ){
          /*
            選択解除
          */
          s1Selected.delete(id);
          el.classList.remove(
            'selected'
          );
        }else{
          /*
            選択
          */
          s1Selected.add(id);
          el.classList.add(
            'selected'
          );
        }
        /*
          現在の4人組の選択を保存
        */
        s1Choices[s1i]=
          new Set(
            s1Selected
          );
      };
    });
  /* =========================
     次へ
  ========================= */
  document
    .getElementById('next')
    .onclick=()=>{
      /*
        現在の選択を保存
      */
      s1Choices[s1i]=
        new Set(
          s1Selected
        );
      s1i++;
      if(
        s1i<
        s1Groups.length
      ){
        /*
          次の4人
        */
        renderS1();
      }else{
        /*
          STEP1終了
        */
        finishS1();
      }
    };
  /* =========================
     前の4人へ
  ========================= */
  if(s1i>0){
    document
      .getElementById('back')
      .onclick=()=>{
        /*
          現在の選択を保存
        */
        s1Choices[s1i]=
          new Set(
            s1Selected
          );
        /*
          1つ前へ
        */
        s1i--;
        /*
          前の選択を復元
        */
        renderS1();
      };
  }
}
/* ==================================================
   STEP1終了
   選ばれた人だけをSTEP2へ
================================================== */
function finishS1(){

  /*
    スコアをリセット
  */
  scores=
    new Map(
      items.map(
        x=>[x.id,0]
      )
    );

  /*
    STEP1の選択結果から
    スコアを計算
  */
  s1Choices.forEach(
    choice=>{
      choice.forEach(
        id=>{
          scores.set(
            id,
            scores.get(id)+1
          );
        }
      );
    }
  );

  /*
    1回以上選ばれた人だけ
  */
  const selected=
    items.filter(
      x=>
        scores.get(x.id)>0
    );

  const selectedCount=
    selected.length;

   /*
    18人未満ならやり直し
  */
  if(
    selectedCount<18
  ){
    app.innerHTML=`
      <div class="stage">
        もう一度チャレンジ！
      </div>

      <p class="instruction">
        STEP1で選ばれた人数が
        <b>${selectedCount}人</b>
        でした。
        <br><br>
        18人以上
        選ばれる必要があります。
      </p>

      <div class="actions">
        <button id="restart">
          最初からやり直す
        </button>
      </div>
    `;

    document
      .getElementById('restart')
      .onclick=()=>{
        start();
      };

    return;
  }

  /*
    STEP2で使う人を保存
  */
  s2Results=
    shuffle(selected);

  /*
    STEP2の得点をリセット
  */
  s2Scores=
    new Map(
      selected.map(
        x=>[x.id,0]
      )
    );

  /*
    STEP2を1回目から開始
  */
  s2Round=0;

  startS2Round();
}
/* ==================================================
   STEP2
   3回戦
   1位＝2点
   2位＝1点
================================================== */

function startS2Round(){

  /*
    3回終了したら得点集計
  */
  if(
    s2Round>=3
  ){
    finishS2();
    return;
  }

  /*
    毎回シャッフルして
    新しい組み合わせを作る
  */
  const players=
    shuffle(
      s2Results
    );

  s2Groups=[];

  for(
    let i=0;
    i<players.length;
    i+=4
  ){
    s2Groups.push(
      players.slice(i,i+4)
    );
  }

  s2i=0;
  s2First=null;

  renderS2First();
}


/* ==================================================
   1位選択
================================================== */

function renderS2First(){

  const g=
    s2Groups[s2i];

  /*
    最後が1人の場合
    自動通過
  */
  if(
    g.length===1
  ){

    s2i++;

    if(
      s2i<
      s2Groups.length
    ){
      renderS2First();
    }else{
      s2Round++;
      startS2Round();
    }

    return;
  }

  progress(
    25+
    (
      (
        s2Round/
        3
      )+
      (
        s2i/
        s2Groups.length/
        3
      )
    )*25,
    50
  );

  app.innerHTML=`

    <div class="stage">
      STEP 2 / 3
    </div>

    <p class="instruction">

      第${s2Round+1}回戦

      <br><br>

      この${g.length}人の中から
      <b>1位</b>
      を選んでください

      <br>

      <small>
        1位：2点
      </small>

    </p>

    <div class="grid">

      ${
        g.map(
          x=>card(x)
        ).join('')
      }

    </div>

    <div class="actions">

      <button id="back">
        STEP1に戻る
      </button>

    </div>
  `;

  /*
    1位を選択
  */
  document
    .querySelectorAll('.card')
    .forEach(el=>{

      el.onclick=()=>{

        s2First=
          g.find(
            x=>
              x.id==
              +el.dataset.id
          );

        /*
          1位＝2点
        */
        s2Scores.set(
          s2First.id,
          s2Scores.get(
            s2First.id
          )+2
        );

        renderS2Second();

      };

    });

  /*
    STEP1へ戻る
  */
  document
    .getElementById('back')
    .onclick=()=>{

      s1i=
        s1Groups.length-1;

      renderS1();

    };
}


/* ==================================================
   2位選択
================================================== */

function renderS2Second(){

  const rem=
    s2Groups[s2i].filter(
      x=>
        x.id!==s2First.id
    );

  app.innerHTML=`

    <div class="stage">
      STEP 2 / 3
    </div>

    <p class="instruction">

      第${s2Round+1}回戦

      <br><br>

      残り${rem.length}人から
      <b>2位</b>
      を選んでください

      <br>

      <small>
        2位：1点
      </small>

    </p>

    <div class="grid">

      ${
        rem.map(
          x=>card(x)
        ).join('')
      }

    </div>

    <div class="actions">

      <button id="back">
        1位選択に戻る
      </button>

    </div>
  `;

  /*
    2位を選択
  */
  document
    .querySelectorAll('.card')
    .forEach(el=>{

      el.onclick=()=>{

        const second=
          rem.find(
            x=>
              x.id==
              +el.dataset.id
          );

        /*
          2位＝1点
        */
        s2Scores.set(
          second.id,
          s2Scores.get(
            second.id
          )+1
        );

        s2i++;

        s2First=null;

        /*
          次のグループへ
        */
        if(
          s2i<
          s2Groups.length
        ){

          renderS2First();

        }else{

          /*
            1回戦終了
          */
          s2Round++;

          startS2Round();

        }

      };

    });

  /*
    1位選択に戻る
  */
  document
    .getElementById('back')
    .onclick=()=>{

      /*
        1位の2点を取り消す
      */
      s2Scores.set(
        s2First.id,
        s2Scores.get(
          s2First.id
        )-2
      );

      renderS2First();

    };
}


/* ==================================================
   STEP2終了
   得点上位9人をSTEP3へ
================================================== */

function finishS2(){

  /*
    得点順に並べる
    同点ならランダム
  */
  const ranked=
    shuffle(
      s2Results
    ).sort(
      (a,b)=>
        s2Scores.get(b.id)-
        s2Scores.get(a.id)
    );

  /*
    上位9人
  */
  finalCandidates=
    ranked.slice(0,9);

  /*
    STEP3開始
  */
  finalWins=
    new Map(
      finalCandidates.map(
        x=>[x.id,0]
      )
    );

  finalMatches=
    makeMatches(
      finalCandidates,
      4
    );

  finalI=0;

  renderFinal();
}
/* ==================================================
   STEP3
   18人 → TOP9
================================================== */
function makeMatches(
  cands,
  rounds=4
){

  const matches=[];
  const used=new Set();

  /*
    人数に関係なく、
    1人につき4人の相手と対戦する
  */

  const n=cands.length;

  for(let offset=1; offset<=rounds/2; offset++){

    for(let i=0; i<n; i++){

      const j=
        (i+offset)%n;

      const x=cands[i];
      const y=cands[j];

      const key=[
        Math.min(x.id,y.id),
        Math.max(x.id,y.id)
      ].join('-');

      /*
        同じ組み合わせは1回だけ
      */
      if(!used.has(key)){

        used.add(key);

        matches.push({
          a:x,
          b:y
        });

      }

    }

  }

  /*
    対戦順をランダムにする
  */
  return shuffle(matches);
}
/* ==================================================
   STEP3画面
================================================== */
function renderFinal(){
  if(
    finalI>=
    finalMatches.length
  ){
    finishFinal();
    return;
  }
  const m=
    finalMatches[finalI];
  progress(
    50+
    finalI/
    finalMatches.length*
    50,
    100
  );
  app.innerHTML=`
    <div class="stage">
      STEP 3 / 3
    </div>
    <p class="instruction">
      どちらが好き？
      <b>
        ${finalI+1}
        /
        ${finalMatches.length}
      </b>
    </p>
    <div class="grid">
      ${card(m.a)}
      ${card(m.b)}
    </div>
    <div class="notice">
  ${finalCandidates.length}候補が
  それぞれ4回ずつ
  対戦します
</div>
  `;
  document
    .querySelectorAll('.card')
    .forEach(el=>{
      el.onclick=()=>{
        const id=
          +el.dataset.id;
        finalWins.set(
          id,
          finalWins.get(id)+1
        );
        finalI++;
        renderFinal();
      };
    });
}
/* ==================================================
   結果
================================================== */
function finishFinal(){
  const result=
    shuffle(
      finalCandidates
    )
    .sort(
      (a,b)=>
        finalWins.get(b.id)-
        finalWins.get(a.id)
    )
    .slice(0,9);
  progress(
    100,
    100
  );
  /*
    
    写真配置
    4位 5位 6位
    2位 1位 3位
    7位 8位 9位
  */
  const photoOrder=[
    3,4,5,
    1,0,2,
    6,7,8
  ];
  app.innerHTML=`
    <div class="stage">
      🎉 あなたのTOP9 🎉
    </div>
    <p class="instruction">
      あなたが選んだTOP9はこちら！
    </p>
    <div class="top9-photo-grid">
      ${
        photoOrder.map(
          index=>{
            const x=
              result[index];
            return `
              <div class="top9-photo">
                <img
                  src="${x.image}"
                  onerror="imgError(this)"
                >
              </div>
            `;
          }
        ).join('')
      }
    </div>
    <div class="ranking-list">
      ${
        result.map(
          (x,i)=>`
            <div class="ranking-item">
              <span>
                ${i+1}位
              </span>
              <span>
                ${x.name}
              </span>
            </div>
          `
        ).join('')
      }
    </div>
    <div class="actions">
      <button
        onclick="location.reload()"
      >
        もう一度やる
      </button>
    </div>
  `;
}
/* ==================================================
   START
================================================== */
start();
</script>
