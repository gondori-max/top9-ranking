<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TOP9決定戦</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f7f7;color:#222}.container{max-width:760px;margin:auto;padding:20px 14px 40px}h1{text-align:center;margin:8px 0 6px;font-size:28px}.subtitle{text-align:center;color:#666;margin:0 0 18px}.progress{height:10px;background:#e8e8e8;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress-bar{height:100%;width:0;background:#222;transition:.2s}.stage{text-align:center;font-weight:700;margin-bottom:8px}.instruction{text-align:center;color:#555;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:2px solid #ddd;border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s;position:relative}.card.selected{border-color:#111;box-shadow:0 0 0 2px #111 inset}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.card .name{padding:10px;text-align:center;font-weight:700}.actions{text-align:center;margin-top:20px}button{border:0;border-radius:12px;background:#111;color:#fff;padding:13px 25px;font-size:16px;font-weight:700;cursor:pointer}.notice{text-align:center;color:#777;margin-top:10px;font-size:13px}.results{background:#fff;border-radius:16px;padding:16px}.result-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:9px 0}.rank{width:34px;font-weight:800;text-align:center}.result-row img{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#eee}.result-name{font-weight:700;flex:1}.wins{font-size:13px;color:#666}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
/.top9-photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:20px 0 24px;
}

.top9-photo{
  aspect-ratio:1/1;
  border-radius:10px;
  overflow:hidden;
  background:#eee;
}

.top9-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.ranking-list{
  background:#fff;
  border-radius:14px;
  padding:10px 16px;
}

.ranking-item{
  display:flex;
  gap:20px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.ranking-item:last-child{
  border-bottom:none;
}

.ranking-item span:first-child{
  width:45px;
  font-weight:700;
}</style></head>
<body><div class="container"><h1>TOP9決定戦</h1><p class="subtitle">あなたの好きな9人を決定！</p><div class="progress"><div id="progressBar" class="progress-bar"></div></div><div id="app"></div></div>
<script>
const items=Array.from({length:71},(_,i)=>({id:i+1,name:`候補 ${i+1}`,image:`images/${String(i+1).padStart(3,'0')}.jpg`}));
const app=document.getElementById('app'),bar=document.getElementById('progressBar');
let s1Groups=[],s1i=0,s1Selected=new Set(),scores=new Map();let s2Groups=[],s2i=0,s2First=null,s2Results=[];let finalCandidates=[],finalMatches=[],finalI=0,finalWins=new Map();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function imgError(img){img.onerror=null;img.src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#eee"/><text x="200" y="200" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#888">画像なし</text></svg>')}
function card(x,sel=false){return `<div class="card ${sel?'selected':''}" data-id="${x.id}"><img src="${x.image}" onerror="imgError(this)"><div class="name">${x.name}</div></div>`}
function progress(n,total){bar.style.width=Math.min(100,n/total*100)+'%'}
function start(){
  let a=shuffle(items);
  s1Groups=[];

  for(let i=0;i<a.length;i+=4){
    s1Groups.push(a.slice(i,i+4));
  }

  s1i=0;
  s1Selected=new Set();
  scores=new Map(items.map(x=>[x.id,0]));

  renderS1();
}
function renderS1(){let g=s1Groups[s1i];progress(s1i,s1Groups.length);;app.innerHTML=`<div class="stage">STEP 1 / 3</div><p class="instruction">4人の中から、好きな人を <b>0〜4人</b> 選んでください</p><div class="grid">${g.map(x=>card(x,s1Selected.has(x.id))).join('')}</div><div class="actions"><button id="next">次へ</button></div><div class="notice">0人を選ぶ場合は、そのまま「次へ」</div>`;document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{let id=+el.dataset.id;if(s1Selected.has(id)){s1Selected.delete(id);el.classList.remove('selected')}else{s1Selected.add(id);el.classList.add('selected')}});document.getElementById('next').onclick=()=>{s1Selected.forEach(id=>scores.set(id,scores.get(id)+1));s1i++;s1Selected=new Set();s1i<25?renderS1():finishS1()}}
function finishS1(){let ranked=shuffle(items).sort((a,b)=>scores.get(b.id)-scores.get(a.id));let top36=ranked.slice(0,36);s2Groups=[];for(let i=0;i<36;i+=4)s2Groups.push(top36.slice(i,i+4));s2i=0;s2First=null;s2Results=[];renderS2First()}
function renderS2First(){let g=s2Groups[s2i];progress(25+s2i/9*25,50);app.innerHTML=`<div class="stage">STEP 2 / 3</div><p class="instruction">この4人の中から <b>1位</b> を選んでください</p><div class="grid">${g.map(x=>card(x)).join('')}</div>`;document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{s2First=g.find(x=>x.id==el.dataset.id);renderS2Second()})}
function renderS2Second(){let rem=s2Groups[s2i].filter(x=>x.id!==s2First.id);app.innerHTML=`<div class="stage">STEP 2 / 3</div><p class="instruction">残り3人から <b>2位</b> を選んでください</p><div class="grid">${rem.map(x=>card(x)).join('')}</div>`;document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{s2Results.push(s2First,rem.find(x=>x.id==el.dataset.id));s2i++;s2First=null;s2i<9?renderS2First():startFinal()})}
function makeMatches(cands,rounds=4){let target=cands.length*rounds/2,matches=[],used=new Set(),tries=0;while(matches.length<target&&tries++<2000){let a=shuffle(cands),pairs=[],ok=true;for(let i=0;i<a.length;i+=2){let x=a[i],y=a[i+1],key=[Math.min(x.id,y.id),Math.max(x.id,y.id)].join('-');if(used.has(key)){ok=false;break}pairs.push({a:x,b:y,key})}if(ok)pairs.forEach(p=>{used.add(p.key);matches.push({a:p.a,b:p.b})})}while(matches.length<target){let a=shuffle(cands);for(let i=0;i<a.length&&matches.length<target;i+=2)matches.push({a:a[i],b:a[i+1]})}return shuffle(matches)}
function startFinal(){finalCandidates=s2Results;finalWins=new Map(finalCandidates.map(x=>[x.id,0]));finalMatches=makeMatches(finalCandidates,4);finalI=0;renderFinal()}
function renderFinal(){if(finalI>=finalMatches.length)return finishFinal();let m=finalMatches[finalI];progress(50+finalI/finalMatches.length*50,100);app.innerHTML=`<div class="stage">STEP 3 / 3</div><p class="instruction">どちらが好き？ <b>${finalI+1} / ${finalMatches.length}</b></p><div class="grid">${card(m.a)}${card(m.b)}</div><div class="notice">18候補がそれぞれ4回ずつ対戦します</div>`;document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{let id=+el.dataset.id;finalWins.set(id,finalWins.get(id)+1);finalI++;renderFinal()})}
function finishFinal(){
  const result = shuffle(finalCandidates)
    .sort((a,b) => finalWins.get(b.id) - finalWins.get(a.id))
    .slice(0,9);

  setProgress(100,100);

  // 写真の配置順：4位・5位・6位 / 2位・1位・3位 / 7位・8位・9位
  const photoOrder = [3,4,5,1,0,2,6,7,8];

  app.innerHTML = `
    <div class="stage">🎉 あなたのTOP9 🎉</div>
    <p class="instruction">あなたが選んだTOP9はこちら！</p>

    <div class="top9-photo-grid">
      ${photoOrder.map(index => {
        const x = result[index];
        return `
          <div class="top9-photo">
            <img src="${x.image}" onerror="imgError(this)">
          </div>
        `;
      }).join("")}
    </div>

    <div class="ranking-list">
      ${result.map((x,i) => `
        <div class="ranking-item">
          <span>${i+1}位</span>
          <span>${x.name}</span>
        </div>
      `).join("")}
    </div>

    <div class="actions">
      <button onclick="location.reload()">もう一度やる</button>
    </div>
  `;
}
start();
</script></body></html>
