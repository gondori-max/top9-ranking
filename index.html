<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP9決定戦</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 30px #0001}
h1{font-size:25px;margin:0 0 6px;text-align:center}.sub{text-align:center;color:#777;margin:0 0 18px}
.progress{height:8px;background:#e9e9ed;border-radius:99px;overflow:hidden;margin:12px 0 20px}
.bar{height:100%;background:#555;transition:.2s}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{border:2px solid #e5e5ea;background:#fff;border-radius:16px;padding:0;overflow:hidden;cursor:pointer;position:relative}
.opt.selected{border-color:#111;box-shadow:0 0 0 2px #111}
.opt img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee}
.opt .label{display:block;padding:10px 8px;font-weight:700;font-size:15px}
.primary,.secondary{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer}
.primary{background:#222;color:#fff}.secondary{background:#eee}
.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}
.rank{display:flex;align-items:center;gap:12px;background:#f7f7f9;border-radius:14px;padding:9px}
.rank img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.num{width:28px;font-weight:900;text-align:center}.name{flex:1;font-weight:700}.wins{font-size:13px;color:#777}
.hidden{display:none}.hint{text-align:center;color:#888;font-size:12px;margin-top:12px}
@media(max-width:480px){.wrap{padding:10px}.card{padding:14px}.options{gap:8px}.opt .label{font-size:13px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🏆 TOP9決定戦</h1>
<p class="sub">100個の候補から、あなたのTOP9を決めよう！</p>

<section id="game">
  <div id="stageTitle"></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="content"></div>
</section>

<section id="result" class="hidden">
  <h2 style="text-align:center">🏆 TOP9</h2>
  <div id="ranking"></div>
  <div class="actions"><button class="secondary" onclick="location.reload()">もう一度遊ぶ</button></div>
</section>
</div></div>

<script>
/*
  写真は images/001.jpg ～ images/100.jpg に入れてください。
  名前は候補名に変更してください。
*/
const items = Array.from({length:100},(_,i)=>({
  id:i+1,
  name:`候補 ${i+1}`,
  image:`images/${String(i+1).padStart(3,'0')}.jpg`
}));

let shuffled=[], groups=[], g=0, selected=[];
let stage1Score={}, stage2=[], finalCandidates=[], finalRank=[];

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function img(x){return `<img src="${x.image}" alt="${esc(x.name)}" loading="eager" onerror="this.style.background='#ddd'">`}

function start(){
  shuffled=shuffle(items);
  groups=[];
  for(let i=0;i<shuffled.length;i+=4) groups.push(shuffled.slice(i,i+4));
  // 100個なので25グループ。毎回ページを開くたびに順番をシャッフル。
  stage1Score={}; items.forEach(x=>stage1Score[x.id]=0);
  g=0; showStage1();
}

function showStage1(){
  if(g>=25){finishStage1();return}
  selected=[];
  const group=groups[g];
  title(`STEP 1　${g+1} / 25`,`この4つから<strong>0〜4個</strong>選んでください`);
  bar(g/25*100);
  content(`<div class="options">${group.map((x,i)=>`
    <button class="opt" data-i="${i}" onclick="toggle(this)">
      ${img(x)}<span class="label">${esc(x.name)}</span>
    </button>`).join('')}</div>
    <div class="actions"><button class="primary" onclick="next1()">次へ</button></div>
    <div class="hint">※0〜4個選択できます（何も選ばず「次へ」もOK）</div>`);
}
function toggle(b){
  const i=+b.dataset.i;
  if(b.classList.contains('selected')){
    b.classList.remove('selected'); selected=selected.filter(x=>x!==i);
  }else if(selected.length<4){b.classList.add('selected');selected.push(i)}
}
function next1(){
  // 0個選択でもそのまま次へ進めます
  selected.forEach(i=>stage1Score[groups[g][i].id]++);
  g++;showStage1();
}
function finishStage1(){
  const top=[...items].sort((a,b)=>stage1Score[b.id]-stage1Score[a.id]||Math.random()-.5).slice(0,36);
  groups=[];for(let i=0;i<36;i+=4)groups.push(top.slice(i,i+4));
  g=0;stage2=[];showStage2();
}
function showStage2(){
  if(g>=9){finishStage2();return}
  const group=groups[g];
  title(`STEP 2　${g+1} / 9`,`4つの中から<strong>1位</strong>を選んでください`);
  bar(g/9*100);
  content(`<div class="options">${group.map((x,i)=>`
    <button class="opt" onclick="pickFirst(${i})">${img(x)}<span class="label">${esc(x.name)}</span></button>`).join('')}</div>`);
}
function pickFirst(i){
  const group=groups[g], first=group[i];
  const rest=group.filter((_,j)=>j!==i);
  title(`STEP 2　${g+1} / 9`,`続いて<strong>2位</strong>を選んでください`);
  content(`<div class="options">${rest.map(x=>`
    <button class="opt" onclick="pickSecond(${x.id})">${img(x)}<span class="label">${esc(x.name)}</span></button>`).join('')}</div>`);
  window._first=first;
}
function pickSecond(id){
  stage2.push(window._first,groups[g].find(x=>x.id===id));
  g++;showStage2();
}
function finishStage2(){
  // 18候補から、好きな順に9個だけ選びます。
  // 153回の一対一比較は行いません。
  finalCandidates=[...stage2];
  finalRank=[];
  pickFinal();
}
function pickFinal(){
  if(finalRank.length>=9){finish();return}
  const n=finalRank.length+1;
  title(`STEP 3　${n} / 9`,`18候補の中から、あなたの<strong>${n}位</strong>を選んでください`);
  bar(finalRank.length/9*100);
  content(`<div class="options">${finalCandidates.map(x=>`
    <button class="opt" onclick="pickFinalOne(${x.id})">${img(x)}<span class="label">${esc(x.name)}</span></button>`).join('')}</div>
    <div class="hint">※選んだ候補は次の順位では表示されません</div>`);
}
function pickFinalOne(id){
  const x=finalCandidates.find(x=>x.id===id);
  if(!x)return;
  finalRank.push(x);
  finalCandidates=finalCandidates.filter(x=>x.id!==id);
  pickFinal();
}
function finish(){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('ranking').innerHTML=finalRank.map((x,i)=>`
    <div class="rank"><div class="num">${i+1}</div>${img(x)}<div class="name">${esc(x.name)}</div></div>`).join('');
}
function title(a,b){document.getElementById('stageTitle').innerHTML=`<h2>${a}</h2><p class="sub">${b}</p>`}
function bar(v){document.getElementById('bar').style.width=v+'%'}
function content(v){document.getElementById('content').innerHTML=v}
start();
</script>
</body>
</html>
