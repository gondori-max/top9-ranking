const items=Array.from(

/* =========================
   DOM
========================= */
const app=document.getElementById('app');
const bar=document.getElementById('progressBar');
/* =========================
   STEP1
========================= */
let s1Groups=[];
let s1i=0;
let s1Selected=new Set();
/*
  各4人グループで
  どの人を選んだか保存する
*/
let s1Choices=[];
let scores=new Map();
/* =========================
   STEP2
========================= */
let s2Groups=[];
let s2i=0;
let s2First=null;
let s2Results=[];

let s2Round=0;
let s2Scores=new Map();
/* =========================
   STEP3
========================= */
let finalCandidates=[];
let finalMatches=[];
let finalI=0;
let finalWins=new Map();
/* =========================
   シャッフル
========================= */
function shuffle(a){
  a=[...a];
  for(
    let i=a.length-1;
    i>0;
    i--
  ){
    let j=
      Math.floor(
        Math.random()*(i+1)
      );
    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];
  }
  return a;
}
/* =========================
   画像エラー
========================= */
function imgError(img){

  const extensions=[
    '.JPG',
    '.jpeg',
    '.JPEG',
    '.webp',
    '.WEBP'
  ];

  let current=
    img.src.split('/').pop();

  let base=
    current.substring(
      0,
      current.lastIndexOf('.')
    );

  let tried=
    img.dataset.tried
      ? Number(img.dataset.tried)
      : 0;

  if(tried<extensions.length){

    img.dataset.tried=
      tried+1;

    img.src=
      'images/'+
      base+
      extensions[tried];

    return;
  }

  img.onerror=null;

  img.src=
    'data:image/svg+xml;charset=UTF-8,'+
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" '+
      'viewBox="0 0 400 400">'+
      '<rect width="400" height="400" fill="#eee"/>'+
      '<text x="200" y="200" '+
      'text-anchor="middle" '+
      'dominant-baseline="middle" '+
      'font-size="24" fill="#888">'+
      '画像なし</text>'+
      '</svg>'
    );
}
/* =========================
   カード
========================= */
function card(x,selected=false){
  return `
    <div
      class="card ${selected?'selected':''}"
      data-id="${x.id}"
    >
      <img
        src="${x.image}"
        onerror="imgError(this)"
      >
      <div class="name">
        ${x.name}
      </div>
    </div>
  `;
}
/* =========================
   プログレスバー
========================= */
function progress(n,total){
  bar.style.width=
    Math.min(
      100,
      n/total*100
    )+'%';
}
/* ==================================================
   STEP1開始
   85人を4人ずつに分ける
================================================== */
function start(){
  const a=shuffle(items);
  s1Groups=[];
  for(
    let i=0;
    i<a.length;
    i+=4
  ){
    s1Groups.push(
      a.slice(i,i+4)
    );
  }
/*
  85人なので
  4人 × 21グループ
  ＋最後1人
  =22グループ
*/
  s1i=0;
  /*
    各グループの選択内容を保存
  */
  s1Choices=
    s1Groups.map(
      ()=>new Set()
    );
  s1Selected=
    new Set();
  scores=
    new Map(
      items.map(
        x=>[x.id,0]
      )
    );
  renderS1();
}
/* ==================================================
   STEP1画面
================================================== */
function renderS1(){
  /*
    前のグループから戻ってきた場合、
    そのときの選択を復元
  */
  s1Selected=
    new Set(
      s1Choices[s1i]
    );
  const g=
    s1Groups[s1i];
  progress(
    s1i,
    s1Groups.length
  );
  app.innerHTML=`
    <div class="stage">
      STEP 1 / 3
    </div>
    <p class="instruction">
      4人の中から、
      好きな人を
      <b>0〜4人</b>
      選んでください
    </p>
    <div class="grid">
      ${
        g.map(
          x=>
            card(
              x,
              s1Selected.has(x.id)
            )
        ).join('')
      }
    </div>
    <div class="actions">
      ${
        s1i>0
        ?
        `
          <button
            id="back"
            class="back-button"
          >
            ← 前の4人に戻る
          </button>
        `
        :
        ''
      }
      <button id="next">
        次へ
      </button>
    </div>
    <div class="notice">
      0人を選ぶ場合は、
      そのまま「次へ」
    </div>
  `;
  /* =========================
     カード選択
  ========================= */
  document
    .querySelectorAll('.card')
    .forEach(el=>{
      el.onclick=()=>{
        const id=
          +el.dataset.id;
        if(
          s1Selected.has(id)
        ){
          /*
            選択解除
          */
          s1Selected.delete(id);
          el.classList.remove(
            'selected'
          );
        }else{
          /*
            選択
          */
          s1Selected.add(id);
          el.classList.add(
            'selected'
          );
        }
        /*
          現在の4人組の選択を保存
        */
        s1Choices[s1i]=
          new Set(
            s1Selected
          );
      };
    });
  /* =========================
     次へ
  ========================= */
  document
    .getElementById('next')
    .onclick=()=>{
      /*
        現在の選択を保存
      */
      s1Choices[s1i]=
        new Set(
          s1Selected
        );
      s1i++;
      if(
        s1i<
        s1Groups.length
      ){
        /*
          次の4人
        */
        renderS1();
      }else{
        /*
          STEP1終了
        */
        finishS1();
      }
    };
  /* =========================
     前の4人へ
  ========================= */
  if(s1i>0){
    document
      .getElementById('back')
      .onclick=()=>{
        /*
          現在の選択を保存
        */
        s1Choices[s1i]=
          new Set(
            s1Selected
          );
        /*
          1つ前へ
        */
        s1i--;
        /*
          前の選択を復元
        */
        renderS1();
      };
  }
}
/* ==================================================
   STEP1終了
   選ばれた人だけをSTEP2へ
================================================== */
function finishS1(){

  /*
    スコアをリセット
  */
  scores=
    new Map(
      items.map(
        x=>[x.id,0]
      )
    );

  /*
    STEP1の選択結果から
    スコアを計算
  */
  s1Choices.forEach(
    choice=>{
      choice.forEach(
        id=>{
          scores.set(
            id,
            scores.get(id)+1
          );
        }
      );
    }
  );

  /*
    1回以上選ばれた人だけ
  */
  const selected=
    items.filter(
      x=>
        scores.get(x.id)>0
    );

  const selectedCount=
    selected.length;

/*
  STEP1結果の名前
*/
const selectedNames=
  selected
    .map(x=>x.name)
    .join('・');

/*
  18人未満の場合
*/
if(
  selectedCount<18
){

  app.innerHTML=`

    <div class="stage">
      STEP 1 結果
    </div>

    <p class="instruction">

      <b>
        18人以上選んでください
      </b>

      <br><br>

      ${selectedNames}

    </p>

    <div class="actions">

      <button id="restart">
        最初からやり直す
      </button>

    </div>

  `;

  document
    .getElementById('restart')
    .onclick=()=>{
      start();
    };

  return;
}

/*
  18人以上の場合
*/

app.innerHTML=`

  <div class="stage">
    STEP 1 結果
  </div>

  <p class="instruction">

    <b>
      ${selectedCount}人を選びました！
    </b>

    <br><br>

    ${selectedNames}

  </p>

  <div class="actions">

    <button id="startStep2">
      STEP2へ進む
    </button>

  </div>

`;

/*
  STEP2へ進む
*/
document
  .getElementById('startStep2')
  .onclick=()=>{

    s2Results=
      shuffle(selected);

    s2Scores=
      new Map(
        selected.map(
          x=>[x.id,0]
        )
      );

    s2Round=0;

    startS2Round();

  };
}
/* ==================================================
   STEP2
   3回戦
   1位＝2点
   2位＝1点
================================================== */

function startS2Round(){

  /*
    3回終了したら得点集計
  */
  if(
    s2Round>=3
  ){
    finishS2();
    return;
  }

  /*
    毎回シャッフルして
    新しい組み合わせを作る
  */
  const players=
    shuffle(
      s2Results
    );

  s2Groups=[];

  for(
    let i=0;
    i<players.length;
    i+=4
  ){
    s2Groups.push(
      players.slice(i,i+4)
    );
  }

  s2i=0;
  s2First=null;

  renderS2First();
}


/* ==================================================
   1位選択
================================================== */

function renderS2First(){

  const g=
    s2Groups[s2i];

  /*
    最後が1人の場合
    自動通過
  */
  if(
    g.length===1
  ){

    s2i++;

    if(
      s2i<
      s2Groups.length
    ){
      renderS2First();
    }else{
      s2Round++;
      startS2Round();
    }

    return;
  }

  progress(
    25+
    (
      (
        s2Round/
        3
      )+
      (
        s2i/
        s2Groups.length/
        3
      )
    )*25,
    50
  );

  app.innerHTML=`

    <div class="stage">
      STEP 2 / 3
    </div>

    <p class="instruction">

      第${s2Round+1}回戦

      <br><br>

      この${g.length}人の中から
      <b>1位</b>
      を選んでください

      <br>

      <small>
        1位：2点
      </small>

    </p>

    <div class="grid">

      ${
        g.map(
          x=>card(x)
        ).join('')
      }

    </div>

    <div class="actions">

      <button id="back">
        STEP1に戻る
      </button>

    </div>
  `;

  /*
    1位を選択
  */
  document
    .querySelectorAll('.card')
    .forEach(el=>{

      el.onclick=()=>{

        s2First=
          g.find(
            x=>
              x.id==
              +el.dataset.id
          );

        /*
          1位＝2点
        */
        s2Scores.set(
          s2First.id,
          s2Scores.get(
            s2First.id
          )+2
        );

        renderS2Second();

      };

    });

  /*
    STEP1へ戻る
  */
  document
    .getElementById('back')
    .onclick=()=>{

      s1i=
        s1Groups.length-1;

      renderS1();

    };
}


/* ==================================================
   2位選択
================================================== */

function renderS2Second(){

  const rem=
    s2Groups[s2i].filter(
      x=>
        x.id!==s2First.id
    );

  app.innerHTML=`

    <div class="stage">
      STEP 2 / 3
    </div>

    <p class="instruction">

      第${s2Round+1}回戦

      <br><br>

      残り${rem.length}人から
      <b>2位</b>
      を選んでください

      <br>

      <small>
        2位：1点
      </small>

    </p>

    <div class="grid">

      ${
        rem.map(
          x=>card(x)
        ).join('')
      }

    </div>

    <div class="actions">

      <button id="back">
        1位選択に戻る
      </button>

    </div>
  `;

  /*
    2位を選択
  */
  document
    .querySelectorAll('.card')
    .forEach(el=>{

      el.onclick=()=>{

        const second=
          rem.find(
            x=>
              x.id==
              +el.dataset.id
          );

        /*
          2位＝1点
        */
        s2Scores.set(
          second.id,
          s2Scores.get(
            second.id
          )+1
        );

        s2i++;

        s2First=null;

        /*
          次のグループへ
        */
        if(
          s2i<
          s2Groups.length
        ){

          renderS2First();

        }else{

          /*
            1回戦終了
          */
          s2Round++;

          startS2Round();

        }

      };

    });

  /*
    1位選択に戻る
  */
  document
    .getElementById('back')
    .onclick=()=>{

      /*
        1位の2点を取り消す
      */
      s2Scores.set(
        s2First.id,
        s2Scores.get(
          s2First.id
        )-2
      );

      renderS2First();

    };
}


/* ==================================================
   STEP2終了
   得点上位9人をSTEP3へ
================================================== */

function finishS2(){

  /*
    得点順に並べる
    同点ならランダム
  */
  const ranked=
    shuffle(
      s2Results
    ).sort(
      (a,b)=>
        s2Scores.get(b.id)-
        s2Scores.get(a.id)
    );

  /*
    上位9人
  */
  finalCandidates=
    ranked.slice(0,9);

  /*
    STEP3開始
  */
  finalWins=
    new Map(
      finalCandidates.map(
        x=>[x.id,0]
      )
    );

  finalMatches=
  makeMatches(
    finalCandidates
  );

  finalI=0;

  renderFinal();
}
/* ==================================================
   STEP3
   9人全員総当たり
================================================== */

function makeMatches(cands){

  const matches=[];

  for(let i=0;i<cands.length;i++){

    for(let j=i+1;j<cands.length;j++){

      matches.push({
        a:cands[i],
        b:cands[j]
      });

    }

  }

  return shuffle(matches);
}

/* ==================================================
   STEP3画面
================================================== */
function renderFinal(){
  if(
    finalI>=
    finalMatches.length
  ){
    finishFinal();
    return;
  }
  const m=
    finalMatches[finalI];
  progress(
    50+
    finalI/
    finalMatches.length*
    50,
    100
  );
  app.innerHTML=`
    <div class="stage">
      STEP 3 / 3
    </div>
    <p class="instruction">
      どちらが好き？
      <b>
        ${finalI+1}
        /
        ${finalMatches.length}
      </b>
    </p>
    <div class="grid">
      ${card(m.a)}
      ${card(m.b)}
    </div>
    <div class="notice">
  ${finalCandidates.length}人全員が
  お互いに1回ずつ対戦します
  <br>
  全${finalMatches.length}試合
</div>
  `;
  document
    .querySelectorAll('.card')
    .forEach(el=>{
      el.onclick=()=>{
        const id=
          +el.dataset.id;
        finalWins.set(
          id,
          finalWins.get(id)+1
        );
        finalI++;
        renderFinal();
      };
    });
}
/* ==================================================
   結果
================================================== */
function finishFinal(){
  const result=
    shuffle(
      finalCandidates
    )
    .sort(
      (a,b)=>
        finalWins.get(b.id)-
        finalWins.get(a.id)
    )
    .slice(0,9);
  progress(
    100,
    100
  );
  /*
    
    写真配置
    4位 5位 6位
    2位 1位 3位
    7位 8位 9位
  */
  const photoOrder=[
    3,4,5,
    1,0,2,
    6,7,8
  ];
  app.innerHTML=`
    <div class="stage">
      🎉 あなたのTOP9 🎉
    </div>
    <p class="instruction">
      あなたが選んだTOP9はこちら！
    </p>
    <div class="top9-photo-grid">
      ${
        photoOrder.map(
          index=>{
            const x=
              result[index];
            return `
              <div class="top9-photo">
                <img
                  src="${x.image}"
                  onerror="imgError(this)"
                >
              </div>
            `;
          }
        ).join('')
      }
    </div>
    <div class="ranking-list">
      ${
        result.map(
          (x,i)=>`
            <div class="ranking-item">
              <span>
                ${i+1}位
              </span>
              <span>
                ${x.name}
              </span>
            </div>
          `
        ).join('')
      }
    </div>
    <div class="actions">
      <button
        onclick="location.reload()"
      >
        もう一度やる
      </button>
    </div>
  `;
}
